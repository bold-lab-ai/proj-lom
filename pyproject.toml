[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 65", "wheel"]

[project]
name = "lom"
version = "0.1.0"
description = "Latent Option Models: learning abstract actions from actionless data (NeurIPS 2025)"
authors = [
  {name = "Eduardo Pignatelli", email = "edu.pignatelli@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = {text = "Apache-2.0"}

dependencies = [
  "torch>=2.14,<2.15",
  "numpy>=2.5",
  "tyro>=1.0",
  "wandb>=0.31",
  "tqdm>=4.70",
  "psutil>=7.2",
  "pyyaml>=6.0",
  "matplotlib>=3.11",
  "nle>=1.3",
]

[dependency-groups]
dev = ["pytest>=9.0", "pytest-cov", "py-spy"]

[tool.setuptools.packages.find]
include = ["lom*"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
